name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Tests
        run: cargo test -p pcl-base

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri Application
        run: npm run tauri build

      - name: Package Windows Portable Release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "target\release\bundle\portable"
          if (Test-Path "target\release\app.exe") {
            Copy-Item "target\release\app.exe" -Destination "target\release\bundle\portable\Pure Build Launcher.exe"
            Compress-Archive -Path "target\release\bundle\portable\Pure Build Launcher.exe" -DestinationPath "target\release\bundle\portable\Pure-Build-Launcher-Windows-x64-Portable.zip" -Force
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Build-Launcher-Windows-x64
          if-no-files-found: warn
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/portable/*.zip

  build-macos:
    name: macOS Universal Build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable with Universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Tests
        run: cargo test -p pcl-base

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri Universal Application
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Package macOS Portable Tarball
        run: |
          mkdir -p target/universal-apple-darwin/release/bundle/portable
          if [ -d "target/universal-apple-darwin/release/bundle/macos/Pure Build Launcher.app" ]; then
            tar -czvf "target/universal-apple-darwin/release/bundle/portable/Pure-Build-Launcher-macOS-Universal-Portable.tar.gz" -C "target/universal-apple-darwin/release/bundle/macos" "Pure Build Launcher.app"
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Build-Launcher-macOS-Universal
          if-no-files-found: warn
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/portable/*.tar.gz

  build-linux:
    name: Linux x64 Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            rpm

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Tests
        run: cargo test -p pcl-base

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri Application
        run: npm run tauri build

      - name: Package Linux Portable Tarball
        run: |
          mkdir -p target/release/bundle/portable
          if [ -f "target/release/app" ]; then
            cp "target/release/app" "target/release/bundle/portable/pure-build-launcher"
            tar -czvf "target/release/bundle/portable/Pure-Build-Launcher-Linux-x64-Portable.tar.gz" -C "target/release/bundle/portable" "pure-build-launcher"
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Build-Launcher-Linux-x64
          if-no-files-found: warn
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/portable/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Flatten and Prepare Assets
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.zip" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
