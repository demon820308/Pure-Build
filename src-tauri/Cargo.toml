[package]
name = "pure-build-launcher"
version = "0.1.1"
description = "Pure Build Launcher - Tauri 2.0 Edition"
authors = ["Pure Build Team"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
pcl-base = { path = "../crates/pcl-base" }
